name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json
      - name: p3c-check passes a clean file and fails a violating one
        run: |
          S=skills/alibaba-java-guidelines/scripts/p3c-check.sh
          mkdir -p /tmp/ok /tmp/bad
          printf 'public class Ok {\n}\n' > /tmp/ok/Ok.java
          printf 'public class Bad {\n    boolean same(Integer a, Integer b) {\n        return a == b;\n    }\n}\n' > /tmp/bad/Bad.java
          sh "$S" /tmp/ok
          set +e; sh "$S" /tmp/bad; code=$?; set -e
          test "$code" -eq 4
